<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 900 500" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect y="70" width="900" height="500" fill="#ffffff"/>
  <!-- System boundary -->
  <rect x="200" y="90" width="500" height="450" rx="6" fill="#f7faf8" stroke="#14532d" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" font-weight="700" fill="#14532d">Student Result Management System</text>

  <!-- Association lines (drawn first, under the ovals) -->
  <g stroke="#333" stroke-width="1.3" fill="none">
    <!-- Administrator -->
    <line x1="104" y1="270" x2="226" y2="160"/>
    <line x1="104" y1="270" x2="226" y2="225"/>
    <line x1="104" y1="270" x2="226" y2="290"/>
    <line x1="104" y1="270" x2="226" y2="355"/>
    <line x1="104" y1="270" x2="226" y2="420"/>
    <!-- Lecturer -->
    <line x1="796" y1="215" x2="680" y2="185"/>
    <line x1="796" y1="215" x2="680" y2="385"/>
    <!-- Student -->
    <line x1="796" y1="465" x2="680" y2="475"/>
  </g>

  <!-- «include» -->
  <line x1="585" y1="209" x2="585" y2="266" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/>
  <path d="M579 258 L585 268 L591 258" fill="none" stroke="#333" stroke-width="1.3"/>
  <text x="593" y="242" font-size="12" fill="#555">«include»</text>

  <!-- Use cases -->
  <g fill="#ffffff" stroke="#14532d" stroke-width="1.6">
    <ellipse cx="320" cy="160" rx="95" ry="24"/>
    <ellipse cx="320" cy="225" rx="95" ry="24"/>
    <ellipse cx="320" cy="290" rx="95" ry="24"/>
    <ellipse cx="320" cy="355" rx="95" ry="24"/>
    <ellipse cx="320" cy="420" rx="95" ry="24"/>
    <ellipse cx="585" cy="185" rx="95" ry="24"/>
    <ellipse cx="585" cy="290" rx="95" ry="24" stroke-dasharray="0"/>
    <ellipse cx="585" cy="385" rx="95" ry="24"/>
    <ellipse cx="585" cy="475" rx="95" ry="24"/>
  </g>
  <g text-anchor="middle" fill="#1a2230">
    <text x="320" y="165">Register students</text>
    <text x="320" y="230">Manage courses</text>
    <text x="320" y="295">Enrol students</text>
    <text x="320" y="360">Publish results</text>
    <text x="320" y="425">View dashboard</text>
    <text x="585" y="190">Enter scores</text>
    <text x="585" y="295">Compute grade</text>
    <text x="585" y="390">Submit results</text>
    <text x="585" y="480">View results &amp; CGPA</text>
  </g>

  <!-- Actors (stick figures) -->
  <g stroke="#1a2230" stroke-width="2" fill="none">
    <!-- Administrator at (80,270) -->
    <circle cx="80" cy="228" r="13" fill="#ffffff"/>
    <line x1="80" y1="241" x2="80" y2="278"/>
    <line x1="58" y1="254" x2="102" y2="254"/>
    <line x1="80" y1="278" x2="62" y2="306"/>
    <line x1="80" y1="278" x2="98" y2="306"/>
    <!-- Lecturer at (820,215) -->
    <circle cx="820" cy="173" r="13" fill="#ffffff"/>
    <line x1="820" y1="186" x2="820" y2="223"/>
    <line x1="798" y1="199" x2="842" y2="199"/>
    <line x1="820" y1="223" x2="802" y2="251"/>
    <line x1="820" y1="223" x2="838" y2="251"/>
    <!-- Student at (820,465) -->
    <circle cx="820" cy="423" r="13" fill="#ffffff"/>
    <line x1="820" y1="436" x2="820" y2="473"/>
    <line x1="798" y1="449" x2="842" y2="449"/>
    <line x1="820" y1="473" x2="802" y2="501"/>
    <line x1="820" y1="473" x2="838" y2="501"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2230">
    <text x="80" y="328">Administrator</text>
    <text x="820" y="273">Lecturer</text>
    <text x="820" y="523">Student</text>
  </g>
  <text x="450" y="556" text-anchor="middle" font-size="12" fill="#5d6876">All actors sign in first (UC-01)</text>
</svg>
